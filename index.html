<!DOCTYPE html>
<html lang="es" data-tema="dia">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>IA Aplicada · Zegel</title>
<meta name="description" content="Curso Inteligencia Artificial Generativa Aplicada — Zegel. Ing. César Uribe.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   IA APLICADA · Utopian Scholastic Contemporánea
   Shell de aplicación. El marco no se mueve nunca.
   ═══════════════════════════════════════════════════════════ */

:root{
  /* Identidad — invariable en ambos temas */
  --violeta-profundo:#2A0048;
  --violeta:#560072;
  --purpura:#800080;
  --magenta-profundo:#A90072;
  --magenta:#D50048;
  --rojo:#FF0000;
  --grad:linear-gradient(90deg,#2A0048 0%,#800080 40%,#D50048 74%,#FF0000 100%);
  --grad-boton:linear-gradient(94deg,#560072,#D50048);

  --ease:cubic-bezier(.2,.8,.2,1);
  --dur:340ms;
  --w-rail:284px;
  --h-tope:56px;
  --medida:70ch;
}

html[data-tema="dia"]{
  --fondo:#FFFFFF;
  --rail:#FAFAFA;
  --superficie:#FFFFFF;
  --hover:#F0F0F0;
  --activo:#EDE7F2;
  --linea:#E7E7E7;
  --linea-tenue:#F1F1F1;
  --tinta:#111111;
  --tinta-suave:#4B4B4B;
  --micro:#8A8A8A;
  --codigo:#FCFCFC;
  --realce:#F4F4F4;
  --acento:var(--magenta-profundo);
  --velo:rgba(17,17,17,.16);
  --sombra:0 2px 14px rgba(0,0,0,.045);
  --sombra-alta:0 -10px 40px rgba(0,0,0,.10);
}

html[data-tema="noche"]{
  --fondo:#0E0B12;
  --rail:#141019;
  --superficie:#17131C;
  --hover:#1F1927;
  --activo:#241C2E;
  --linea:#2A2431;
  --linea-tenue:#211B29;
  --tinta:#E8E6EA;
  --tinta-suave:#B0AAB8;
  --micro:#7E7688;
  --codigo:#141019;
  --realce:#1F1927;
  --acento:#E0559A;
  --velo:rgba(0,0,0,.46);
  --sombra:0 2px 14px rgba(0,0,0,.35);
  --sombra-alta:0 -10px 40px rgba(0,0,0,.45);
}

*{box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}

body{
  margin:0;
  background:var(--fondo);
  color:var(--tinta);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  font-size:17px;line-height:1.7;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease);
}

::selection{background:var(--activo);color:var(--tinta);}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
a{color:inherit;}
:focus-visible{outline:2px solid var(--purpura);outline-offset:3px;border-radius:2px;}
svg{display:block;}

.micro{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--micro);}
.oculto{display:none !important;}

/* ── Estructura ───────────────────────────────────────────── */

.app{
  display:grid;
  grid-template-columns:var(--w-rail) minmax(0,1fr);
  height:100dvh;
  transition:grid-template-columns var(--dur) var(--ease);
}
.app.plegado{grid-template-columns:0 minmax(0,1fr);}

/* ── RAIL ─────────────────────────────────────────────────── */

.rail{
  display:flex;flex-direction:column;min-height:0;min-width:0;
  background:var(--rail);
  border-right:1px solid var(--linea);
  overflow:hidden;
  transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease);
}

.rail__tope{
  height:var(--h-tope);flex:0 0 auto;
  display:flex;align-items:center;gap:6px;padding:0 10px 0 16px;
}
.rail__logo{
  font-family:'DM Serif Display','Times New Roman',Georgia,serif;
  font-size:18px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--tinta);white-space:nowrap;flex:1 1 auto;
  text-decoration:none;line-height:1;
}
.icono{
  width:32px;height:32px;flex:0 0 auto;border-radius:8px;
  display:grid;place-items:center;color:var(--tinta-suave);
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease);
}
.icono:hover{background:var(--hover);color:var(--tinta);}
.icono svg{width:16px;height:16px;}

.rail__lista{
  flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  padding:8px 8px 16px;scrollbar-width:thin;
}
.rail__lista::-webkit-scrollbar{width:8px;}
.rail__lista::-webkit-scrollbar-thumb{background:var(--linea);border-radius:8px;border:2px solid var(--rail);}

.nav__grupo{padding:14px 10px 6px;margin:0;}

.item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:8px 10px;border-radius:8px;margin-bottom:1px;
  font-size:14.5px;color:var(--tinta);
  transition:background var(--dur) var(--ease);
}
.item:hover{background:var(--hover);}
.item.activo{background:var(--activo);font-weight:600;}
.item__txt{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item__marca{
  width:3px;height:16px;border-radius:2px;flex:0 0 auto;
  background:var(--grad);opacity:0;
}
.item.activo .item__marca{opacity:1;}

/* Secciones desplegables */
.plegable__cabeza{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:8px 10px;border-radius:8px;
  font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--micro);
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease);
}
.plegable__cabeza:hover{background:var(--hover);color:var(--tinta-suave);}
.plegable__flecha{width:12px;height:12px;flex:0 0 auto;transition:transform var(--dur) var(--ease);}
.plegable[data-abierto="si"] .plegable__flecha{transform:rotate(90deg);}
.plegable__cuerpo{display:none;padding-left:6px;}
.plegable[data-abierto="si"] .plegable__cuerpo{display:block;}
.plegable__n{
  font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--micro);
  flex:0 0 auto;min-width:20px;
}
.item.activo .plegable__n{
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
}

/* Pie: docente */
.rail__pie{
  flex:0 0 auto;border-top:1px solid var(--linea);padding:10px 12px;
  display:flex;align-items:center;gap:8px;
}
.docente{
  flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:10px;
  padding:6px 8px;border-radius:8px;text-align:left;
  transition:background var(--dur) var(--ease);
}
.docente:hover{background:var(--hover);}
.docente__avatar{
  width:30px;height:30px;flex:0 0 auto;border-radius:50%;
  background:var(--grad);display:grid;place-items:center;
  color:#FFF;font-size:11px;font-weight:600;letter-spacing:.02em;
}
.docente__txt{min-width:0;}
.docente__n{display:block;font-size:13px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.docente__m{display:block;font-size:11px;color:var(--micro);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rail__redes{display:flex;gap:2px;flex:0 0 auto;}
.rail__redes .icono{width:28px;height:28px;}
.rail__redes .icono svg{width:15px;height:15px;}

/* ── PANEL PRINCIPAL ──────────────────────────────────────── */

.principal{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;}

.tope{
  position:relative;height:var(--h-tope);flex:0 0 auto;
  display:flex;align-items:center;gap:10px;padding:0 16px;
  border-bottom:1px solid var(--linea);
  background:var(--fondo);
  z-index:20;
  transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease);
}
.tope__abrir{display:none;}
.app.plegado .tope__abrir{display:grid;}
.tope__ruta{flex:1 1 auto;min-width:0;display:flex;align-items:baseline;gap:10px;}
.tope__seccion{flex:0 0 auto;}
.tope__titulo{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tope__pct{flex:0 0 auto;}
.tope__progreso{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--grad);will-change:width;}

/* ── Lectura ──────────────────────────────────────────────── */

.lectura{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;scroll-behavior:smooth;}
.lectura::-webkit-scrollbar{width:10px;}
.lectura::-webkit-scrollbar-thumb{background:var(--linea);border-radius:10px;border:3px solid var(--fondo);}
.hoja{max-width:var(--medida);margin:0 auto;padding:52px 28px 180px;}

.doc{opacity:0;transform:translateY(8px);transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease);}
.doc.puesto{opacity:1;transform:none;}

.doc__meta{display:flex;flex-wrap:wrap;gap:8px 18px;padding-bottom:14px;border-bottom:1px solid var(--linea);margin-bottom:26px;}
.doc__titulo{
  font-family:'DM Serif Display','Times New Roman',Georgia,serif;font-weight:400;
  font-size:clamp(31px,4.4vw,43px);line-height:1.14;letter-spacing:-.015em;margin:0 0 12px;
}
.doc__resumen{font-size:19px;color:var(--tinta-suave);margin:0 0 38px;}

/* Registro markdown */
.md h1{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:34px;line-height:1.2;margin:48px 0 14px;}
.md h2{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:27px;line-height:1.25;margin:48px 0 14px;}
.md h3{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin:34px 0 10px;}
.md h4{font-size:16px;font-weight:600;margin:28px 0 8px;}
.md p{margin:0 0 18px;}
.md strong{font-weight:600;color:var(--tinta);}
.md em{font-style:italic;}
.md ul,.md ol{margin:0 0 18px;padding-left:0;list-style:none;}
.md ul li{position:relative;padding-left:22px;margin-bottom:9px;}
.md ul li::before{content:"";position:absolute;left:0;top:.72em;width:7px;height:1px;background:var(--acento);}
.md ol{counter-reset:n;}
.md ol li{position:relative;padding-left:30px;margin-bottom:9px;counter-increment:n;}
.md ol li::before{content:counter(n,decimal-leading-zero);position:absolute;left:0;top:.1em;font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--acento);}
.md blockquote{margin:30px 0;padding:2px 0 2px 20px;border-left:2px solid var(--purpura);color:var(--tinta-suave);}
.md blockquote p{margin:0 0 10px;}
.md blockquote p:last-child{margin:0;}
.md hr{border:0;border-top:1px solid var(--linea);margin:42px 0;}
.md pre{
  margin:0 0 20px;padding:18px 20px;border:1px solid var(--linea);border-radius:6px;
  background:var(--codigo);overflow-x:auto;white-space:pre-wrap;word-break:break-word;
  font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;font-size:13.5px;line-height:1.66;
}
.md code{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;font-size:.88em;background:var(--realce);padding:2px 5px;border-radius:4px;}
.md pre code{background:none;padding:0;}
.md table{width:100%;border-collapse:collapse;margin:0 0 24px;font-size:15px;}
.md th,.md td{border:1px solid var(--linea);padding:10px 12px;text-align:left;vertical-align:top;}
.md th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--micro);font-weight:600;}
.md img{max-width:100%;height:auto;display:block;margin:28px 0 10px;border:1px solid var(--linea);border-radius:4px;}
.md a{color:var(--acento);text-decoration:none;border-bottom:1px solid var(--linea);}
.md a:hover{border-bottom-color:var(--acento);}
.md .video{position:relative;aspect-ratio:16/9;margin:28px 0;border:1px solid var(--linea);border-radius:6px;overflow:hidden;}
.md .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}

.estado{padding:60px 0;text-align:center;}
.estado__caja{max-width:56ch;margin:0 auto;padding:22px;border:1px solid var(--linea);border-radius:8px;text-align:left;font-size:14.5px;color:var(--tinta-suave);}
.estado__caja code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--realce);padding:2px 6px;border-radius:4px;}

/* ── Compositor / comentarios ─────────────────────────────── */

.compositor{
  position:absolute;left:0;right:0;bottom:0;padding:14px 28px 20px;z-index:25;pointer-events:none;
  background:linear-gradient(180deg,transparent 0%,var(--fondo) 44%);
}
.compositor__caja{
  max-width:var(--medida);margin:0 auto;pointer-events:auto;
  display:flex;align-items:center;gap:12px;width:100%;
  padding:11px 11px 11px 20px;
  border:1px solid var(--linea);border-radius:26px;background:var(--superficie);
  box-shadow:var(--sombra);text-align:left;
  transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease),background var(--dur) var(--ease);
}
.compositor__caja:hover{border-color:var(--purpura);}
.compositor__caja:active{transform:translateY(1px);}
.compositor__txt{flex:1 1 auto;font-size:15px;color:var(--micro);}
.compositor__cuenta{flex:0 0 auto;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--micro);}
.compositor__ir{flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:var(--grad-boton);display:grid;place-items:center;color:#FFF;}
.compositor__ir svg{width:15px;height:15px;}
.compositor__nota{max-width:var(--medida);margin:8px auto 0;text-align:center;font-size:10.5px;color:var(--micro);opacity:.7;}

.velo{position:absolute;inset:0;z-index:40;background:var(--velo);opacity:0;visibility:hidden;transition:opacity var(--dur) var(--ease),visibility var(--dur) var(--ease);}
.velo.abierto{opacity:1;visibility:visible;}

.hilo{
  position:absolute;left:0;right:0;bottom:0;z-index:45;height:min(76%,720px);
  display:flex;flex-direction:column;background:var(--fondo);
  border-top:1px solid var(--linea);border-radius:16px 16px 0 0;box-shadow:var(--sombra-alta);
  transform:translateY(100%);visibility:hidden;
  transition:transform var(--dur) var(--ease),visibility var(--dur) var(--ease);
}
.hilo.abierto{transform:none;visibility:visible;}
.hilo__tope{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--linea);}
.hilo__tope h2{margin:0;font-size:14px;font-weight:600;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hilo__cuerpo{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:18px 18px 32px;}

/* ── Ventanas flotantes (buscador / docente) ──────────────── */

.modal{
  position:fixed;inset:0;z-index:90;display:grid;
  opacity:0;visibility:hidden;
  transition:opacity var(--dur) var(--ease),visibility var(--dur) var(--ease);
}
.modal.abierto{opacity:1;visibility:visible;}
.modal__velo{position:absolute;inset:0;background:var(--velo);}
.modal__caja{
  position:relative;z-index:2;justify-self:center;
  width:min(680px,92vw);max-height:min(70vh,620px);
  margin-top:12vh;
  display:flex;flex-direction:column;
  background:var(--fondo);border:1px solid var(--linea);border-radius:14px;
  box-shadow:0 24px 60px rgba(0,0,0,.22);
  transform:translateY(-10px) scale(.99);
  transition:transform var(--dur) var(--ease);
  overflow:hidden;
}
.modal.abierto .modal__caja{transform:none;}

.buscador__campo{
  flex:0 0 auto;display:flex;align-items:center;gap:12px;
  padding:16px 18px;border-bottom:1px solid var(--linea);
}
.buscador__campo svg{width:17px;height:17px;color:var(--micro);flex:0 0 auto;}
.buscador__campo input{
  flex:1 1 auto;border:0;background:none;font:inherit;font-size:17px;color:var(--tinta);outline:none;
}
.buscador__campo input::placeholder{color:var(--micro);}
.buscador__tecla{
  flex:0 0 auto;font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--micro);
  border:1px solid var(--linea);border-radius:5px;padding:3px 7px;
}
.buscador__res{flex:1 1 auto;min-height:0;overflow-y:auto;padding:8px;}
.res{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:8px;transition:background var(--dur) var(--ease);}
.res:hover,.res.marcado{background:var(--hover);}
.res__t{display:block;font-size:15px;font-weight:600;margin-bottom:2px;}
.res__s{display:block;font-size:13px;color:var(--tinta-suave);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.res mark{background:var(--activo);color:var(--tinta);padding:0 2px;border-radius:2px;}
.buscador__vacio{padding:36px 18px;text-align:center;}

.ficha{overflow-y:auto;padding:0;}
.ficha__tope{
  display:flex;align-items:center;gap:14px;padding:22px 24px;border-bottom:1px solid var(--linea);
}
.ficha__avatar{width:48px;height:48px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#FFF;font-size:16px;font-weight:600;flex:0 0 auto;}
.ficha__id{flex:1 1 auto;min-width:0;}
.ficha__id b{display:block;font-size:16px;font-weight:600;}
.ficha__cuerpo{padding:22px 24px 28px;}
.ficha__redes{display:flex;gap:8px;padding:0 24px 22px;}
.ficha__enlace{
  display:inline-flex;align-items:center;gap:8px;padding:9px 16px;
  border:1px solid var(--linea);border-radius:20px;font-size:13px;text-decoration:none;
  transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease);
}
.ficha__enlace:hover{border-color:var(--purpura);background:var(--hover);}
.ficha__enlace svg{width:14px;height:14px;}

/* ── Móvil ────────────────────────────────────────────────── */

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);}
  .app.plegado{grid-template-columns:minmax(0,1fr);}
  .rail{
    position:fixed;top:0;bottom:0;left:0;width:min(84vw,300px);z-index:70;
    transform:translateX(-100%);transition:transform var(--dur) var(--ease);
    box-shadow:0 0 40px rgba(0,0,0,.24);
  }
  .rail.movil{transform:none;}
  .tope__abrir{display:grid !important;}
  .velo-rail{position:fixed;inset:0;z-index:65;background:var(--velo);opacity:0;visibility:hidden;
    transition:opacity var(--dur) var(--ease),visibility var(--dur) var(--ease);}
  .velo-rail.abierto{opacity:1;visibility:visible;}
  .hoja{padding:34px 20px 168px;}
  .compositor{padding:12px 16px 16px;}
  .hilo{height:88%;}
  .modal__caja{margin-top:6vh;max-height:82vh;}
  .tope__seccion{display:none;}
}

@media (prefers-reduced-motion:reduce){
  .lectura{scroll-behavior:auto;}
  *,*::before,*::after{transition-duration:1ms !important;}
}
</style>
</head>
<body>

<div class="velo-rail" id="veloRail" hidden></div>

<div class="app" id="app">

  <!-- ══ PANEL LATERAL ═══════════════════════════════════ -->
  <aside class="rail" id="rail" aria-label="Navegación del curso">

    <div class="rail__tope">
      <a class="rail__logo" href="#actual">IA Aplicada</a>
      <button class="icono" id="btnBuscar" aria-label="Buscar" title="Buscar (/)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      </button>
      <button class="icono" id="btnPlegar" aria-label="Ocultar panel lateral" title="Ocultar panel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      </button>
    </div>

    <nav class="rail__lista" id="nav"></nav>

    <div class="rail__pie">
      <button class="docente" id="btnDocente">
        <span class="docente__avatar">CU</span>
        <span class="docente__txt">
          <span class="docente__n">Ing. César Uribe</span>
          <span class="docente__m">fcuribe@zegel.pe</span>
        </span>
      </button>

<script>
(function(){
"use strict";

/* ═══ CONFIGURACIÓN ═════════════════════════════════════════ */

var CFG = {
  disqus: "ia-aplicada-zegel",
  base:   "https://uribecesare.github.io/ia-aplicada/",   /* ← ajusta a tu dominio real */
  fijas: [
    {id:"actual",      titulo:"Actual",      ruta:"content/actual.md"},
    {id:"videos",      titulo:"Videos",      ruta:"content/videos.md"},
    {id:"anotaciones", titulo:"Anotaciones", ruta:"content/anotaciones.md"},
    {id:"enlaces",     titulo:"Enlaces",     ruta:"content/enlaces.md"},
    {id:"curso",       titulo:"Curso",       ruta:"content/curso.md"},
    {id:"grabaciones", titulo:"Grabaciones", ruta:"content/grabaciones.md"}
  ]
};

/* ═══ MARKDOWN + FRONT MATTER ═══════════════════════════════ */

function escapar(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* YAML mínimo: clave: valor, listas con "- " */
function frontMatter(texto){
  var meta = {}, cuerpo = texto;
  var m = /^\uFEFF?---\r?\n([\s\S]*?)\r?\n---\r?\n?/.exec(texto);
  if(m){
    cuerpo = texto.slice(m[0].length);
    var clave = null;
    m[1].split(/\r?\n/).forEach(function(linea){
      if(!linea.trim() || /^\s*#/.test(linea)) return;
      var li = /^\s*-\s+(.*)$/.exec(linea);
      if(li && clave){
        if(!Array.isArray(meta[clave])) meta[clave] = [];
        meta[clave].push(limpiar(li[1]));
        return;
      }
      var kv = /^([A-Za-z0-9_\-]+)\s*:\s*(.*)$/.exec(linea);
      if(kv){
        clave = kv[1];
        var v = kv[2].trim();
        if(v === ''){ meta[clave] = []; }
        else if(/^\[.*\]$/.test(v)){
          meta[clave] = v.slice(1,-1).split(',').map(function(x){ return limpiar(x); }).filter(Boolean);
        } else { meta[clave] = limpiar(v); }
      }
    });
  }
  return {meta:meta, cuerpo:cuerpo};
}
function limpiar(v){ return String(v).trim().replace(/^["'](.*)["']$/,'$1'); }

function enLinea(t){
  t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)/g, function(_,alt,src){
        return '<img src="' + src + '" alt="' + alt + '" loading="lazy">'; });
  t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function(_,txt,url){
        var ext = /^https?:/.test(url) ? ' target="_blank" rel="noopener"' : '';
        return '<a href="' + url + '"' + ext + '>' + txt + '</a>'; });
  t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  t = t.replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>');
  return t;
}

function md(fuente){
  var lineas = escapar(fuente.replace(/\r\n/g,'\n')).split('\n');
  var out = [], i = 0;

  function tabla(inicio){
    if(!/\|/.test(lineas[inicio] || '')) return null;
    if(!/^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lineas[inicio+1] || '')) return null;
    var celdas = function(l){
      return l.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(function(c){ return enLinea(c.trim()); });
    };
    var h = '<table><thead><tr>' + celdas(lineas[inicio]).map(function(c){ return '<th>' + c + '</th>'; }).join('') + '</tr></thead><tbody>';
    var j = inicio + 2;
    while(j < lineas.length && /\|/.test(lineas[j]) && lineas[j].trim()){
      h += '<tr>' + celdas(lineas[j]).map(function(c){ return '<td>' + c + '</td>'; }).join('') + '</tr>';
      j++;
    }
    return {html:h + '</tbody></table>', fin:j};
  }

  while(i < lineas.length){
    var l = lineas[i];

    if(!l.trim()){ i++; continue; }

    /* código cercado */
    var cerca = /^\s*```(.*)$/.exec(l);
    if(cerca){
      var buf = [];
      i++;
      while(i < lineas.length && !/^\s*```/.test(lineas[i])){ buf.push(lineas[i]); i++; }
      i++;
      out.push('<pre><code>' + buf.join('\n') + '</code></pre>');
      continue;
    }

    /* regla */
    if(/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(l)){ out.push('<hr>'); i++; continue; }

    /* encabezados */
    var h = /^(#{1,6})\s+(.*)$/.exec(l);
    if(h){ var n = h[1].length; out.push('<h' + n + '>' + enLinea(h[2].trim()) + '</h' + n + '>'); i++; continue; }

    /* tabla */
    var t = tabla(i);
    if(t){ out.push(t.html); i = t.fin; continue; }

    /* cita */
    if(/^\s*&gt;\s?/.test(l)){
      var cita = [];
      while(i < lineas.length && /^\s*&gt;\s?/.test(lineas[i])){
        cita.push(lineas[i].replace(/^\s*&gt;\s?/,''));
        i++;
      }
      out.push('<blockquote>' + md(cita.join('\n').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')) + '</blockquote>');
      continue;
    }

    /* listas */
    if(/^\s*([-*+])\s+/.test(l) || /^\s*\d+[.)]\s+/.test(l)){
      var ord = /^\s*\d+[.)]\s+/.test(l);
      var items = [];
      while(i < lineas.length && (ord ? /^\s*\d+[.)]\s+/.test(lineas[i]) : /^\s*([-*+])\s+/.test(lineas[i]))){
        items.push(enLinea(lineas[i].replace(ord ? /^\s*\d+[.)]\s+/ : /^\s*([-*+])\s+/, '')));
        i++;
      }
      out.push('<' + (ord ? 'ol' : 'ul') + '>' + items.map(function(x){ return '<li>' + x + '</li>'; }).join('') + '</' + (ord ? 'ol' : 'ul') + '>');
      continue;
    }

    /* YouTube en línea propia → incrustado */
    var yt = /^\s*(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]{6,})\S*\s*$/.exec(l);
    if(yt){
      out.push('<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/' + yt[1] +
               '" title="Video" allow="accelerometer;autoplay;clipboard-write;encrypted-media;picture-in-picture" allowfullscreen loading="lazy"></iframe></div>');
      i++; continue;
    }

    /* párrafo */
    var p = [];
    while(i < lineas.length && lineas[i].trim() &&
          !/^(#{1,6})\s/.test(lineas[i]) && !/^\s*```/.test(lineas[i]) &&
          !/^\s*&gt;\s?/.test(lineas[i]) && !/^\s*([-*+])\s+/.test(lineas[i]) &&
          !/^\s*\d+[.)]\s+/.test(lineas[i])){
      p.push(lineas[i].trim()); i++;
    }
    if(p.length) out.push('<p>' + enLinea(p.join(' ')) + '</p>');
  }
  return out.join('\n');
}

/* ═══ ESTADO ════════════════════════════════════════════════ */

var $ = function(id){ return document.getElementById(id); };
var app = $('app'), rail = $('rail'), nav = $('nav'), doc = $('doc'), lectura = $('lectura');
var manifiesto = {clases:[], casos:[]};
var cache = {}, actual = null, posiciones = {}, corpus = null, corpusListo = false;
var disqusCargado = false;

/* ═══ TEMA ══════════════════════════════════════════════════ */

function aplicarTema(t){
  document.documentElement.setAttribute('data-tema', t);
  $('iconoDia').classList.toggle('oculto', t === 'noche');
  $('iconoNoche').classList.toggle('oculto', t !== 'noche');
  var meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', t === 'noche' ? '#0E0B12' : '#FFFFFF');
  try{ localStorage.setItem('ia-tema', t); }catch(e){}
}
(function(){
  var t = null;
  try{ t = localStorage.getItem('ia-tema'); }catch(e){}
  if(!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'noche' : 'dia';
  aplicarTema(t);
})();
$('btnTema').addEventListener('click', function(){
  aplicarTema(document.documentElement.getAttribute('data-tema') === 'noche' ? 'dia' : 'noche');
});

/* ═══ PANEL LATERAL ═════════════════════════════════════════ */

function plegar(){ app.classList.add('plegado'); try{ localStorage.setItem('ia-rail','plegado'); }catch(e){} }
function desplegar(){ app.classList.remove('plegado'); try{ localStorage.setItem('ia-rail','abierto'); }catch(e){} }
$('btnPlegar').addEventListener('click', function(){
  if(window.innerWidth <= 900) return cerrarRailMovil();
  plegar();
});
$('btnMostrar').addEventListener('click', function(){
  if(window.innerWidth <= 900) return abrirRailMovil();
  desplegar();
});
try{ if(localStorage.getItem('ia-rail') === 'plegado') app.classList.add('plegado'); }catch(e){}

var veloRail = $('veloRail');
function abrirRailMovil(){ rail.classList.add('movil'); veloRail.hidden = false; requestAnimationFrame(function(){ veloRail.classList.add('abierto'); }); }
function cerrarRailMovil(){ rail.classList.remove('movil'); veloRail.classList.remove('abierto'); setTimeout(function(){ veloRail.hidden = true; }, 340); }
veloRail.addEventListener('click', cerrarRailMovil);

/* ═══ NAVEGACIÓN ════════════════════════════════════════════ */

function flecha(){
  return '<svg class="plegable__flecha" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';
}

function pintarNav(){
  nav.innerHTML = '';

  CFG.fijas.forEach(function(f){
    nav.appendChild(botonItem(f.id, f.titulo, null));
  });

  nav.appendChild(plegable('clases', 'Clases', manifiesto.clases, false));
  nav.appendChild(plegable('casos',  'Casos',  manifiesto.casos,  true));

  marcarActivo();
}

function botonItem(id, texto, n){
  var b = document.createElement('button');
  b.className = 'item';
  b.setAttribute('data-id', id);
  b.innerHTML = '<span class="item__marca"></span>' +
                (n ? '<span class="plegable__n">' + n + '</span>' : '') +
                '<span class="item__txt"></span>';
  b.querySelector('.item__txt').textContent = texto;
  b.addEventListener('click', function(){
    location.hash = '#' + id;
    if(window.innerWidth <= 900) cerrarRailMovil();
  });
  return b;
}

function plegable(clave, rotulo, entradas, abiertoPorDefecto){
  var cont = document.createElement('div');
  cont.className = 'plegable';
  var guardado = null;
  try{ guardado = localStorage.getItem('ia-pleg-' + clave); }catch(e){}
  cont.setAttribute('data-abierto', guardado ? guardado : (abiertoPorDefecto ? 'si' : 'no'));

  var cabeza = document.createElement('button');
  cabeza.className = 'plegable__cabeza';
  cabeza.innerHTML = flecha() + '<span>' + rotulo + '</span>';
  cabeza.setAttribute('aria-expanded', cont.getAttribute('data-abierto') === 'si');

  var cuerpo = document.createElement('div');
  cuerpo.className = 'plegable__cuerpo';

  if(!entradas.length){
    var vacio = document.createElement('p');
    vacio.className = 'micro';
    vacio.style.padding = '6px 12px';
    vacio.textContent = 'Sin entradas en el manifiesto';
    cuerpo.appendChild(vacio);
  }
  entradas.forEach(function(e){
    var id = clave + '/' + e.archivo.replace(/\.md$/,'');
    cuerpo.appendChild(botonItem(id, e.titulo || e.archivo, e.n || ''));
  });

  cabeza.addEventListener('click', function(){
    var v = cont.getAttribute('data-abierto') === 'si' ? 'no' : 'si';
    cont.setAttribute('data-abierto', v);
    cabeza.setAttribute('aria-expanded', v === 'si');
    try{ localStorage.setItem('ia-pleg-' + clave, v); }catch(e){}
  });

  cont.appendChild(cabeza);
  cont.appendChild(cuerpo);
  return cont;
}

function marcarActivo(){
  var items = nav.querySelectorAll('.item');
  for(var i = 0; i < items.length; i++){
    items[i].classList.toggle('activo', items[i].getAttribute('data-id') === (actual && actual.id));
  }
}

/* ═══ RESOLUCIÓN DE RUTAS ═══════════════════════════════════ */

function resolver(id){
  var fija = CFG.fijas.filter(function(f){ return f.id === id; })[0];
  if(fija) return {id:id, ruta:fija.ruta, seccion:'', titulo:fija.titulo};

  var p = id.split('/');
  if(p.length === 2 && (p[0] === 'clases' || p[0] === 'casos')){
    var lista = manifiesto[p[0]] || [];
    var e = lista.filter(function(x){ return x.archivo.replace(/\.md$/,'') === p[1]; })[0];
    return {
      id:id,
      ruta:p[0] + '/' + p[1] + '.md',
      seccion:p[0] === 'clases' ? 'Clases' : 'Casos',
      titulo:(e && e.titulo) || p[1]
    };
  }
  return null;
}

/* ═══ CARGA DE DOCUMENTOS ═══════════════════════════════════ */

function traer(ruta){
  if(cache[ruta]) return Promise.resolve(cache[ruta]);
  return fetch(ruta, {cache:'no-cache'}).then(function(r){
    if(!r.ok) throw new Error(r.status + ' ' + ruta);
    return r.text();
  }).then(function(txt){
    var d = frontMatter(txt);
    cache[ruta] = d;
    return d;
  });
}

function abrir(id){
  var r = resolver(id);
  if(!r) return abrir('actual');
  if(actual && actual.id === id) return;
  if(actual) posiciones[actual.id] = lectura.scrollTop;

  doc.classList.remove('puesto');
  actual = r;
  marcarActivo();
  $('topeSeccion').textContent = r.seccion;
  $('topeTitulo').textContent = r.titulo;
  $('hiloTitulo').textContent = r.titulo;
  document.title = r.titulo + ' · IA Aplicada';
  $('cuenta').textContent = '';
  $('cuenta').setAttribute('data-disqus-identifier', id);
  if(window.DISQUSWIDGETS) window.DISQUSWIDGETS.getCount({reset:true});
  if(disqusCargado && window.DISQUS) reiniciarDisqus();

  traer(r.ruta).then(function(d){
    if(!actual || actual.id !== id) return;
    var m = d.meta || {};
    var meta = [];
    if(m.modulo)  meta.push(m.modulo);
    if(m.fecha)   meta.push(m.fecha);
    if(m.lectura) meta.push(m.lectura);
    if(m.estado)  meta.push(m.estado);

    doc.innerHTML =
      (meta.length ? '<div class="doc__meta">' + meta.map(function(x){ return '<span class="micro">' + escapar(x) + '</span>'; }).join('') + '</div>' : '') +
      '<h1 class="doc__titulo">' + escapar(m.titulo || r.titulo) + '</h1>' +
      (m.resumen ? '<p class="doc__resumen">' + escapar(m.resumen) + '</p>' : '') +
      '<div class="md">' + md(d.cuerpo) + '</div>';

    if(m.titulo){ $('topeTitulo').textContent = m.titulo; $('hiloTitulo').textContent = m.titulo; }
    lectura.scrollTop = posiciones[id] || 0;
    doc.classList.add('puesto');
    medir();
  }).catch(function(err){
    if(!actual || actual.id !== id) return;
    doc.innerHTML =
      '<div class="estado"><div class="estado__caja">' +
      '<p><strong>No se pudo cargar el documento.</strong></p>' +
      '<p>Ruta solicitada: <code>' + escapar(r.ruta) + '</code></p>' +
      '<p>' + (location.protocol === 'file:'
        ? 'Estás abriendo el proyecto como archivo local. El navegador bloquea la lectura de archivos por seguridad. Levanta un servidor: <code>python -m http.server</code> en la carpeta raíz, o publica en GitHub Pages.'
        : 'Comprueba que el archivo exista y que la raíz contenga un archivo <code>.nojekyll</code>.') + '</p>' +
      '</div></div>';
    doc.classList.add('puesto');
    medir();
  });
}

/* ═══ PROGRESO ══════════════════════════════════════════════ */

var esperando = false;
function medir(){
  var alto = lectura.scrollHeight - lectura.clientHeight;
  var p = alto > 8 ? Math.min(lectura.scrollTop / alto, 1) : 0;
  $('progreso').style.width = (p * 100) + '%';
  $('topePct').textContent = Math.round(p * 100) + '%';
  esperando = false;
}
lectura.addEventListener('scroll', function(){
  if(!esperando){ esperando = true; requestAnimationFrame(medir); }
}, {passive:true});
window.addEventListener('resize', medir);

/* ═══ BUSCADOR ══════════════════════════════════════════════ */

var modalB = $('modalBuscar'), campo = $('campoBuscar'), res = $('resultados'), marcado = -1;

function todasLasRutas(){
  var r = CFG.fijas.map(function(f){ return {id:f.id, titulo:f.titulo, ruta:f.ruta, seccion:''}; });
  ['clases','casos'].forEach(function(k){
    (manifiesto[k] || []).forEach(function(e){
      var slug = e.archivo.replace(/\.md$/,'');
      r.push({id:k + '/' + slug, titulo:e.titulo || slug, ruta:k + '/' + e.archivo, seccion:k === 'clases' ? 'Clases' : 'Casos'});
    });
  });
  return r;
}

function construirCorpus(){
  if(corpus) return Promise.resolve(corpus);
  var rutas = todasLasRutas();
  return Promise.all(rutas.map(function(x){
    return traer(x.ruta).then(function(d){
      return {
        id:x.id,
        titulo:(d.meta && d.meta.titulo) || x.titulo,
        seccion:x.seccion,
        texto:(d.cuerpo || '').replace(/[#>*`_\-|]/g,' ').replace(/\s+/g,' ').trim()
      };
    }).catch(function(){ return {id:x.id, titulo:x.titulo, seccion:x.seccion, texto:''}; });
  })).then(function(c){ corpus = c; corpusListo = true; return c; });
}

function buscar(q){
  q = q.trim().toLowerCase();
  res.innerHTML = '';
  marcado = -1;
  if(!q){
    res.innerHTML = '<p class="buscador__vacio micro">' +
      (corpusListo ? 'Escribe para buscar en todo el curso' : 'Preparando el índice…') + '</p>';
    return;
  }
  if(!corpus){ res.innerHTML = '<p class="buscador__vacio micro">Preparando el índice…</p>'; return; }

  var hits = [];
  corpus.forEach(function(d){
    var tl = d.titulo.toLowerCase(), tx = d.texto.toLowerCase();
    var enT = tl.indexOf(q), enX = tx.indexOf(q);
    if(enT === -1 && enX === -1) return;
    var frag = '';
    if(enX > -1){
      var ini = Math.max(0, enX - 60);
      frag = (ini > 0 ? '…' : '') + d.texto.slice(ini, enX + q.length + 90) + '…';
    }
    hits.push({d:d, peso:(enT > -1 ? 0 : 1), frag:frag});
  });
  hits.sort(function(a,b){ return a.peso - b.peso; });

  if(!hits.length){
    res.innerHTML = '<p class="buscador__vacio micro">Sin resultados</p>';
    return;
  }
  hits.slice(0,40).forEach(function(h){
    var b = document.createElement('button');
    b.className = 'res';
    var t = document.createElement('span'); t.className = 'res__t';
    t.textContent = (h.d.seccion ? h.d.seccion + ' · ' : '') + h.d.titulo;
    var s = document.createElement('span'); s.className = 'res__s';
    s.textContent = h.frag;
    b.appendChild(t); b.appendChild(s);
    b.addEventListener('click', function(){ location.hash = '#' + h.d.id; cerrarModal(modalB); });
    res.appendChild(b);
  });
}

function abrirBuscador(){
  modalB.classList.add('abierto');
  campo.value = '';
  buscar('');
  campo.focus();
  construirCorpus().then(function(){ buscar(campo.value); });
}
$('btnBuscar').addEventListener('click', abrirBuscador);
campo.addEventListener('input', function(){ buscar(campo.value); });
campo.addEventListener('keydown', function(e){
  var items = res.querySelectorAll('.res');
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault();
    if(!items.length) return;
    if(marcado > -1) items[marcado].classList.remove('marcado');
    marcado = e.key === 'ArrowDown'
      ? Math.min(marcado + 1, items.length - 1)
      : Math.max(marcado - 1, 0);
    items[marcado].classList.add('marcado');
    items[marcado].scrollIntoView({block:'nearest'});
  }
  if(e.key === 'Enter' && marcado > -1){ items[marcado].click(); }
});

/* ═══ FICHA DEL DOCENTE ═════════════════════════════════════ */

var modalD = $('modalDocente');
$('btnDocente').addEventListener('click', function(){
  modalD.classList.add('abierto');
  var c = $('fichaCuerpo');
  if(!c.getAttribute('data-cargado')){
    c.innerHTML = '<p class="micro">Cargando…</p>';
    traer('content/docente.md').then(function(d){
      c.innerHTML = md(d.cuerpo);
      c.setAttribute('data-cargado','si');
    }).catch(function(){
      c.innerHTML = '<p>Ingeniero de sistemas, docente de Zegel y formador en inteligencia artificial aplicada. ' +
                    'El archivo <code>content/docente.md</code> no pudo cargarse.</p>';
    });
  }
});

function cerrarModal(m){ m.classList.remove('abierto'); }
Array.prototype.forEach.call(document.querySelectorAll('[data-cerrar]'), function(el){
  el.addEventListener('click', function(){ cerrarModal(el.closest('.modal')); });
});

/* ═══ COMENTARIOS ═══════════════════════════════════════════ */

var velo = $('velo'), hilo = $('hilo'), cargando = $('hiloCargando');

function urlActual(){ return CFG.base + '#' + (actual ? actual.id : 'actual'); }

function reiniciarDisqus(){
  window.DISQUS.reset({reload:true, config:function(){
    this.page.url = urlActual();
    this.page.identifier = actual.id;
    this.page.title = $('hiloTitulo').textContent;
    this.language = 'es';
  }});
}

function cargarDisqus(){
  if(disqusCargado) return;
  disqusCargado = true;
  if(location.protocol === 'file:'){
    if(cargando) cargando.outerHTML =
      '<div class="estado__caja" style="margin:20px auto;"><p><strong>Disqus necesita una URL pública.</strong> ' +
      'Publica el proyecto en GitHub Pages y el hilo cargará aquí dentro, sin salir de la aplicación.</p></div>';
    return;
  }
  window.disqus_config = function(){
    this.page.url = urlActual();
    this.page.identifier = actual.id;
    this.page.title = $('hiloTitulo').textContent;
    this.language = 'es';
  };
  var s = document.createElement('script');
  s.src = 'https://' + CFG.disqus + '.disqus.com/embed.js';
  s.setAttribute('data-timestamp', String(+new Date()));
  s.async = true;
  s.onload = function(){ if(cargando && cargando.parentNode) cargando.parentNode.removeChild(cargando); };
  s.onerror = function(){ if(cargando) cargando.textContent = 'No se pudo cargar el hilo.'; };
  (document.head || document.body).appendChild(s);
}

function abrirHilo(){
  velo.classList.add('abierto'); hilo.classList.add('abierto');
  cargarDisqus();
  if(window.DISQUS && actual) reiniciarDisqus();
  $('cerrarHilo').focus();
}
function cerrarHilo(){
  velo.classList.remove('abierto'); hilo.classList.remove('abierto');
  $('abrirHilo').focus();
}
$('abrirHilo').addEventListener('click', abrirHilo);
$('cerrarHilo').addEventListener('click', cerrarHilo);
velo.addEventListener('click', cerrarHilo);

if(location.protocol !== 'file:'){
  var cs = document.createElement('script');
  cs.src = 'https://' + CFG.disqus + '.disqus.com/count.js';
  cs.id = 'dsq-count-scr'; cs.async = true;
  document.body.appendChild(cs);
}

/* ═══ TECLADO ═══════════════════════════════════════════════ */

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    if(modalB.classList.contains('abierto')) return cerrarModal(modalB);
    if(modalD.classList.contains('abierto')) return cerrarModal(modalD);
    if(hilo.classList.contains('abierto')) return cerrarHilo();
    if(rail.classList.contains('movil')) return cerrarRailMovil();
  }
  var escribiendo = e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA';
  if(escribiendo) return;
  if(e.key === '/'){ e.preventDefault(); abrirBuscador(); }
  if((e.key === 'k' || e.key === 'K') && (e.metaKey || e.ctrlKey)){ e.preventDefault(); abrirBuscador(); }
  if(e.key === 'o' && !hilo.classList.contains('abierto')){ e.preventDefault(); abrirHilo(); }
  if(e.key === 't'){ $('btnTema').click(); }
});

/* ═══ ENRUTADOR ═════════════════════════════════════════════ */

function ruta(){
  var h = (location.hash || '').replace(/^#/, '');
  if(!h){
    try{ h = localStorage.getItem('ia-ultimo') || 'actual'; }catch(e){ h = 'actual'; }
  }
  abrir(h);
  try{ localStorage.setItem('ia-ultimo', h); }catch(e){}
}
window.addEventListener('hashchange', ruta);

/* ═══ ARRANQUE ══════════════════════════════════════════════ */

fetch('content/manifest.json', {cache:'no-cache'})
  .then(function(r){ if(!r.ok) throw new Error('manifest'); return r.json(); })
  .catch(function(){ return {clases:[], casos:[]}; })
  .then(function(m){
    manifiesto = {clases:m.clases || [], casos:m.casos || []};
    pintarNav();
    ruta();
  });

})();
</script>
